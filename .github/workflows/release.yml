name: Publish CodeSentry

on:
      workflow_dispatch:
      push:
            tags: ['v*']

permissions:
      contents: read

env:
      SEMGREP_VERSION: 1.145.0
      PYTHON_VERSION: '3.12'
      NODE_VERSION: '22'

jobs:
      verify:
            runs-on: ubuntu-latest
            steps:
                  - uses: actions/checkout@v4
                  - uses: actions/setup-node@v4
                    with:
                          node-version: ${{ env.NODE_VERSION }}
                          registry-url: https://registry.npmjs.org
                  - run: npm install
                  - run: npm run typecheck
                  - run: npm test
                  - run: npm run build

      rules:
            needs: verify
            runs-on: ubuntu-latest
            steps:
                  - uses: actions/checkout@v4
                  - uses: actions/setup-node@v4
                    with:
                          node-version: ${{ env.NODE_VERSION }}
                          registry-url: https://registry.npmjs.org
                  - run: npm install --ignore-scripts
                  # Rede só é usada na preparação da release; o arquivo publicado é local e fixado.
                  - run: npm run prepare:owasp-rules
                  - name: Check if this version is already published
                    id: check
                    run: |
                          NAME=$(node -p "require('./packages/semgrep-rules/package.json').name")
                          VERSION=$(node -p "require('./packages/semgrep-rules/package.json').version")
                          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
                                echo "skip=true" >> "$GITHUB_OUTPUT"
                          else
                                echo "skip=false" >> "$GITHUB_OUTPUT"
                          fi
                  - run: npm pkg delete private --prefix packages/semgrep-rules
                    if: steps.check.outputs.skip == 'false'
                  - run: npm publish ./packages/semgrep-rules --access public
                    if: steps.check.outputs.skip == 'false'
                    env:
                          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      runtimes:
            needs: [verify, rules]
            strategy:
                  fail-fast: false
                  matrix:
                        include:
                              - os: ubuntu-latest
                                package: packages/semgrep-linux-x64
                                semgrep_binary: semgrep
                              - os: windows-latest
                                package: packages/semgrep-win32-x64
                                semgrep_binary: semgrep.exe
            runs-on: ${{ matrix.os }}
            steps:
                  - uses: actions/checkout@v4
                  - uses: actions/setup-node@v4
                    with:
                          node-version: ${{ env.NODE_VERSION }}
                          registry-url: https://registry.npmjs.org
                  - uses: astral-sh/setup-uv@v6
                  - name: Create portable Python and install Semgrep CE
                    shell: bash
                    run: |
                          uv python install "$PYTHON_VERSION"
                          PYTHON_BIN="$(uv python find "$PYTHON_VERSION")"
                          PYTHON_DIR="$(uv python dir)"
                          # No Git Bash do runner Windows, "uv" é um binário nativo e devolve
                          # caminhos com barra invertida (C:\...); normalizamos para o formato
                          # POSIX antes de qualquer manipulação de string baseada em "/".
                          if command -v cygpath >/dev/null 2>&1; then
                                PYTHON_BIN="$(cygpath -u "$PYTHON_BIN")"
                                PYTHON_DIR="$(cygpath -u "$PYTHON_DIR")"
                          fi
                          echo "PYTHON_BIN=$PYTHON_BIN"
                          echo "PYTHON_DIR=$PYTHON_DIR"
                          # A instalação do uv aninha o executável em profundidades diferentes por
                          # plataforma (ex.: bin/python3.12 no Linux, install/python.exe no Windows).
                          # Em vez de fixar o caminho, descobrimos o nome da pasta raiz da instalação
                          # e o caminho do executável dentro dela, ambos dinamicamente.
                          RELATIVE="${PYTHON_BIN#"$PYTHON_DIR"/}"
                          INSTALL_NAME="${RELATIVE%%/*}"
                          PYTHON_ROOT="$PYTHON_DIR/$INSTALL_NAME"
                          EXE_RELATIVE="${PYTHON_BIN#"$PYTHON_ROOT"/}"
                          echo "PYTHON_ROOT=$PYTHON_ROOT"
                          echo "EXE_RELATIVE=$EXE_RELATIVE"
                          mkdir -p "${{ matrix.package }}/runtime"
                          # "cp -r" (sem -a) já dereferencia symlinks por padrão e NÃO preserva
                          # hard links — ambos importam aqui: a raiz retornada por "uv python
                          # dir"/"find" pode ser, ela mesma, um symlink para o cache interno do uv
                          # (cp -a copiaria o link, e o npm descarta esse link ao empacotar); e a
                          # instalação do Python usa hard links entre executáveis (python3.12,
                          # python3, etc. no mesmo inode), que o registro do npm rejeita ("Hard
                          # link is not allowed") — cp -r os transforma em arquivos independentes.
                          cp -rL "$PYTHON_ROOT" "${{ matrix.package }}/runtime/python"
                          COPIED_PYTHON="${{ matrix.package }}/runtime/python/$EXE_RELATIVE"
                          echo "COPIED_PYTHON=$COPIED_PYTHON"
                          if [ ! -x "$COPIED_PYTHON" ]; then
                                echo "O Python copiado não existe ou não é executável: $COPIED_PYTHON" >&2
                                find "${{ matrix.package }}/runtime/python" -maxdepth 3 >&2
                                exit 1
                          fi
                          "$COPIED_PYTHON" -m pip install --no-cache-dir --break-system-packages "semgrep==$SEMGREP_VERSION"
                          SEMGREP_PATH="$(find "${{ matrix.package }}/runtime/python" -iname "${{ matrix.semgrep_binary }}" -type f | head -n1)"
                          if [ -z "$SEMGREP_PATH" ]; then
                                echo "Não foi possível localizar o executável semgrep instalado." >&2
                                find "${{ matrix.package }}/runtime/python" -maxdepth 5 -iname "semgrep*" >&2
                                exit 1
                          fi
                          echo "SEMGREP_PATH=$SEMGREP_PATH"
                          # Os console_scripts do pip gravam o caminho absoluto do Python usado na
                          # instalação — em texto puro no Linux (primeira linha do script) e, no
                          # Windows, num buffer de tamanho fixo dentro do binário PE do launcher
                          # .exe, logo antes do ZIP anexado que carrega o script de verdade (ver
                          # scripts/rewrite-shebang.py para os detalhes do formato). Esse caminho
                          # nunca existe na máquina de quem instala o pacote publicado. Reescrevemos
                          # para a forma portátil que cada launcher resolve via PATH em tempo de
                          # execução: "#!/usr/bin/env python3" no Linux, "#!python.exe" no Windows
                          # (PEP 397). O runBundledSemgrep já coloca o diretório do runtime na
                          # frente do PATH do processo para essa busca funcionar.
                          NEW_SHEBANG="${{ matrix.os == 'windows-latest' && '#!python.exe' || '#!/usr/bin/env python3' }}"
                          BIN_DIR="$(dirname "$SEMGREP_PATH")"
                          for script in "$BIN_DIR"/*; do
                                [ -f "$script" ] || continue
                                "$COPIED_PYTHON" scripts/rewrite-shebang.py "$script" "$NEW_SHEBANG"
                          done
                          SEMGREP_RELATIVE="${SEMGREP_PATH#"${{ matrix.package }}"/}"
                          node scripts/write-runtime-manifest.mjs "${{ matrix.package }}" "$SEMGREP_RELATIVE"
                          node scripts/write-runtime-lock.mjs "${{ matrix.package }}"
                  - name: Prepare fixed offline OWASP snapshot
                    run: npm run prepare:owasp-rules
                  - name: Smoke test bundled runtime against multi-language fixture
                    shell: bash
                    run: |
                          npm install --no-save "./${{ matrix.package }}"
                          npm run build
                          node dist/index.js scan tests/fixtures/semgrep-multilang --json
                  - name: Check if this version is already published
                    id: check
                    shell: bash
                    run: |
                          NAME=$(node -p "require('./${{ matrix.package }}/package.json').name")
                          VERSION=$(node -p "require('./${{ matrix.package }}/package.json').version")
                          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
                                echo "skip=true" >> "$GITHUB_OUTPUT"
                          else
                                echo "skip=false" >> "$GITHUB_OUTPUT"
                          fi
                  - run: npm pkg delete private --prefix ${{ matrix.package }}
                    if: steps.check.outputs.skip == 'false'
                  - run: npm publish ./${{ matrix.package }} --access public
                    if: steps.check.outputs.skip == 'false'
                    env:
                          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      publish-cli:
            needs: [rules, runtimes]
            runs-on: ubuntu-latest
            steps:
                  - uses: actions/checkout@v4
                  - uses: actions/setup-node@v4
                    with:
                          node-version: ${{ env.NODE_VERSION }}
                          registry-url: https://registry.npmjs.org
                  - run: npm install
                  - run: npm run build
                  - name: Check if this version is already published
                    id: check
                    run: |
                          NAME=$(node -p "require('./package.json').name")
                          VERSION=$(node -p "require('./package.json').version")
                          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
                                echo "skip=true" >> "$GITHUB_OUTPUT"
                          else
                                echo "skip=false" >> "$GITHUB_OUTPUT"
                          fi
                  - run: npm pkg delete private
                    if: steps.check.outputs.skip == 'false'
                  - run: npm publish --access public
                    if: steps.check.outputs.skip == 'false'
                    env:
                          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
